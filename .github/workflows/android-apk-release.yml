name: android-apk-release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-android'

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Build Android APK (if android/ project exists)
        run: |
          if [ -d "android" ]; then
            npx cap sync android || true
            cd android && ./gradlew assembleDebug
            mkdir -p ../dist-apk
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apk/genz-broker-network-debug.apk
          else
            echo "android/ directory not initialized yet; run 'npx cap add android' locally first."
            mkdir -p dist-apk
            echo "Build bundle ready for Capacitor Android packaging" > dist-apk/README.txt
          fi
      - name: Upload APK / Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genz-android-apk
          path: dist-apk/
      - name: Publish to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*
