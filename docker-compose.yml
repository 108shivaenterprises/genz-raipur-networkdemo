# Production stack: app + PostgreSQL + Caddy (automatic HTTPS).  Usage: see docs/DEPLOY_INDIA.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      POSTGRES_DB: genz
      POSTGRES_USER: genz
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genz -d genz"]
      interval: 10s
      retries: 6

  app:
    build: .
    restart: unless-stopped
    mem_limit: ${APP_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://genz:${DB_PASSWORD}@db:5432/genz
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      KYC_VAULT_KEY: ${KYC_VAULT_KEY:-}
      KYC_VAULT_DISABLED: ${KYC_VAULT_DISABLED:-false}   # set true to run with the vault off on purpose; else KYC_VAULT_KEY is needed
      KYC_VAULT_KEY_FILE: ${KYC_VAULT_KEY_FILE:-}
      KYC_RETAIN_DAYS: ${KYC_RETAIN_DAYS:-}
      ALLOW_FRESH_DB: ${ALLOW_FRESH_DB:-false}
      PGSSLMODE: ${PGSSLMODE:-}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-}
      VAPID_KEY_FILE: ${VAPID_KEY_FILE:-/app/data/.vapid.json}   # empty would switch the key file off
      SEED_ADMIN_CITY: ${SEED_ADMIN_CITY:-}
      SEED_ADMIN_COMPANY: ${SEED_ADMIN_COMPANY:-}
      BACKUP_EVERY_MS: ${BACKUP_EVERY_MS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      VIDEO_MAX_MB: ${VIDEO_MAX_MB:-}
      INLET_DAILY_CAP: ${INLET_DAILY_CAP:-}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      FEATURE_VOICE: ${FEATURE_VOICE:-false}
      OTP_MODE: ${OTP_MODE:-manual}
      OTP_WHATSAPP_NUMBER: ${OTP_WHATSAPP_NUMBER:-}
      OTP_DAILY_CAP: ${OTP_DAILY_CAP:-300}
      OTP_CAP_RESET: ${OTP_CAP_RESET:-150}
      OTP_CAP_OWNER: ${OTP_CAP_OWNER:-100}
      OTP_CAP_SIGNUP: ${OTP_CAP_SIGNUP:-50}
      DIGILOCKER_MODE: ${DIGILOCKER_MODE:-manual-review}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=768}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env (https://your-domain)}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-${ADMIN_EMAIL:-admin@genzbuildcon.com}}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DEMO_MODE: "false"
      TRUST_PROXY: ${TRUST_PROXY:-}   # unset = the proxy's own address is used for every rate limit; set 1 behind ONE nginx / load balancer (see docs/DEPLOY_INDIA.md)
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_TOKEN: ${SMS_WEBHOOK_TOKEN:-}
      COMPANY_NAME: ${COMPANY_NAME:-GENZ BUILDCON INFRA PVT LTD}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-Raipur, Chhattisgarh, India}
      GRIEVANCE_NAME: ${GRIEVANCE_NAME:-}
      GRIEVANCE_EMAIL: ${GRIEVANCE_EMAIL:-}
      GRIEVANCE_PHONE: ${GRIEVANCE_PHONE:-}
      TZ: Asia/Kolkata
    volumes:
      - appdata:/app/data   # protected-document page images + auth secret live on disk, not in Postgres
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
